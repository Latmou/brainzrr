# Warning: This docker-compose file is made for development purposes.
# Using it will build an image from the locally cloned repository.
#
# If you want to use Invidious in production, see the docker-compose.yml file provided
# in the installation documentation: https://docs.invidious.io/installation/

services:

  invidious:
    image: quay.io/invidious/invidious:latest
    restart: unless-stopped
    depends_on:
      invidious-db:
        condition: service_healthy
    environment:
      # Please read the following file for a comprehensive list of all available
      # configuration options and their associated syntax:
      # https://github.com/iv-org/invidious/blob/master/config/config.example.yml
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: kemal
          host: invidious-db
          port: 5432
        check_tables: true
        external_port: ${INVIDIOUS_EXTERNAL_PORT:-}
        domain: ${INVIDIOUS_DOMAIN:-localhost}
        https_only: ${INVIDIOUS_HTTPS_ONLY:-false}
        # statistics_enabled: false
        hmac_key: "DVEkjUG7yIi+67B6kpcM55CpORU1+lrDy7C50tW7YMM="
        invidious_companion:
          - private_url: "http://invidious-companion:8282/companion"
        invidious_companion_key: "RFfNIQYW4sS68Q95"
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/stats || exit 1
      interval: 30s
      timeout: 5s
      retries: 2

  invidious-companion:
    image: quay.io/invidious/invidious-companion:latest
    restart: unless-stopped
    environment:
      - SERVER_SECRET_KEY=RFfNIQYW4sS68Q95
    volumes:
      - companioncache:/var/tmp/youtubei.js:rw
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/8282 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 2

  invidious-db:
    image: docker.io/library/postgres:14
    restart: unless-stopped
    volumes:
      - postgresdata:/var/lib/postgresql/data
      - ./config/sql:/config/sql
      - ./docker/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: kemal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]

  brainzrr-db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: verysecurepassword
      POSTGRES_DB: brainzrr
    volumes:
      - brainzrr_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d brainzrr"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MusicBrainz Stack ---
  # Based on official metabrainz/musicbrainz-docker mirror configuration
  musicbrainz:
    image: metabrainz/musicbrainz-docker-musicbrainz:v-2026-02-12.0-build1
    restart: unless-stopped
    depends_on:
      musicbrainz-db:
        condition: service_healthy
      musicbrainz-redis:
        condition: service_started
    environment:
      - MUSICBRAINZ_WEB_SERVER_HOST=musicbrainz
      - MUSICBRAINZ_WEB_SERVER_PORT=5000
      - MUSICBRAINZ_DB_HOST=db
      - MUSICBRAINZ_DB_PORT=5432
      - MUSICBRAINZ_POSTGRES_USER=musicbrainz
      - MUSICBRAINZ_POSTGRES_PASSWORD=musicbrainz
      - MUSICBRAINZ_POSTGRES_DB=musicbrainz_db
      - MUSICBRAINZ_POSTGRES_SERVER=db
      - MUSICBRAINZ_POSTGRES_READONLY_SERVER=db
      - MUSICBRAINZ_REDIS_HOST=redis
      - MUSICBRAINZ_BASE_URI=http://localhost:${MUSICBRAINZ_PORT:-5000}
      - MUSICBRAINZ_REPLICATION_ACCESS_TOKEN=${MUSICBRAINZ_REPLICATION_ACCESS_TOKEN:-}
      # Replication type 2 = Mirror
      - MUSICBRAINZ_REPLICATION_TYPE=2
    networks:
      default:
        aliases:
          - musicbrainz
    volumes:
      - musicbrainz_config:/config
      - musicbrainz_dbdump:/media/dbdump
      - ./init-musicbrainz.sh:/usr/local/bin/init-musicbrainz.sh:ro
    command: /usr/local/bin/init-musicbrainz.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || [ -f /config/importing.lock ] || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 60
    stop_signal: SIGKILL

  musicbrainz-db:
    image: metabrainz/musicbrainz-docker-db:16-build0
    restart: unless-stopped
    command: postgres -c "shared_buffers=256MB"
    networks:
      default:
        aliases:
          - db
    volumes:
      - musicbrainz_db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=musicbrainz
      - POSTGRES_PASSWORD=musicbrainz
      - POSTGRES_DB=musicbrainz_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicbrainz -d musicbrainz_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  musicbrainz-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      default:
        aliases:
          - redis

  musicbrainz-indexer:
    image: metabrainz/sir:py3-git2consul
    restart: unless-stopped
    depends_on:
      musicbrainz-db:
        condition: service_healthy
      musicbrainz-mq:
        condition: service_started
      musicbrainz-search:
        condition: service_started
    environment:
      - SIR_CONFIG=/code/config.ini
    volumes:
      - ./sir_config.ini:/code/config.ini:ro
    command: >
      sh -c "
        python3 -m sir amqp_setup &&
        python3 -m sir triggers -t /tmp/triggers.sql -f /tmp/functions.sql &&
        PGPASSWORD=musicbrainz psql -h db -U musicbrainz -d musicbrainz_db -f /tmp/functions.sql &&
        PGPASSWORD=musicbrainz psql -h db -U musicbrainz -d musicbrainz_db -f /tmp/triggers.sql &&
        python3 -m sir amqp_watch
      "

  musicbrainz-search:
    image: metabrainz/mb-solr:4.1.0
    restart: unless-stopped
    expose:
      - "8983"
    networks:
      default:
        aliases:
          - search
    volumes:
      - musicbrainz_solr_data:/var/solr

  musicbrainz-mq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    networks:
      default:
        aliases:
          - mq

  # --- Application Stack ---
  brainzrr:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://root:verysecurepassword@brainzrr-db:5432/brainzrr
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - MUSICBRAINZ_BASE_URL=http://musicbrainz:5000
    command: bun run build && bun run start
    depends_on:
      - invidious
      - musicbrainz
      - brainzrr-db

volumes:
  postgresdata:
  companioncache:
  musicbrainz_config:
  musicbrainz_db_data:
  musicbrainz_indexer_data:
  musicbrainz_solr_data:
  musicbrainz_dbdump:
  brainzrr_db_data:
